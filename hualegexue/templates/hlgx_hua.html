<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化了个学 · 消除挑战</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hlgx_style.css') }}">
</head>
<body class="game-page">
    <header class="game-top">
        <a class="back" href="/">← 返回大厅</a>
        <span class="title">⚗️ 化了个学</span>
        <span class="remain">❤ <span id="hlgx-hp">3</span> · 剩余 <b id="hlgx-remain">0</b> 块 · ⏱ <span id="hlgx-timer">00:00</span></span>
    </header>

    <div class="hlgx-controls">
        <div class="hlgx-diff">
            <span class="diff-label">难度:</span>
            <button data-diff="easy">简单</button>
            <button data-diff="normal" class="active">标准</button>
            <button data-diff="challenge">挑战</button>
        </div>
        <button id="hlgx-btn-mute" class="mute-btn">🔊 音效</button>
    </div>

    <div id="hlgx-board-wrap">
        <div id="hlgx-board"></div>
    </div>

    <div class="hlgx-tools">
        <button id="hlgx-btn-undo" title="撤销上一步">↩ 撤回</button>
        <button id="hlgx-btn-out" title="将槽内最靠前的 3 块放回棋盘空位">📤 移出</button>
        <button id="hlgx-btn-shuffle" title="打乱剩余物质的位置">🔀 洗牌</button>
    </div>

    <div class="tray-area">
        <div class="tray-label" id="hlgx-tray-label">消除槽 · 点击手牌选中,3 张同类点「消除选中」</div>
        <div class="tray-clear-row">
            <button id="hlgx-btn-clear" class="clear-btn" disabled>消除选中</button>
            <div id="hlgx-flash" class="hlgx-flash"></div>
        </div>
        <div id="hlgx-tray"></div>
        <p class="hlgx-rule">同类判定 = 物质类别相同(如所有「盐类」互相可消)。一次只消 3 张同类;<br>
            选 3 张不同类会扣 1 点血(上限 3);全部卡牌拾取且手牌槽无三消组合时自动通关(最后一步消除也计入)。<br>
            悬停卡牌看性质简介;卡牌颜色仅区分位置。</p>
    </div>

    <details class="hlgx-catalog">
        <summary>🧪 物质图鉴(高考化学范围,共 <span id="hlgx-cat-count"></span> 种)</summary>
        <div id="hlgx-catalog-body"></div>
    </details>

    <!-- 昵称输入弹窗 -->
    <div id="hlgx-name-modal" class="modal">
        <div class="modal-box">
            <h2>🎮 开始一局</h2>
            <input id="hlgx-name-input" type="text" maxlength="12" placeholder="输入游戏昵称(参与排行榜)">
            <label class="skip-label"><input type="checkbox" id="hlgx-skip-rank"> 不参与排行榜,直接开始</label>
            <div id="hlgx-name-tip" class="hlgx-flash"></div>
            <div class="btn-row">
                <a class="back-btn" href="/">← 返回大厅</a>
                <button id="hlgx-name-confirm" class="primary-btn">开始游戏</button>
            </div>
        </div>
    </div>

    <!-- 结算弹窗(通关/失败) -->
    <div id="hlgx-overlay" class="hidden">
        <div class="overlay-box">
            <h2 id="hlgx-overlay-title"></h2>
            <p id="hlgx-overlay-text"></p>
            <div id="hlgx-settle-info" class="settle-info"></div>
            <div class="btn-row">
                <a class="back-btn" href="/">← 返回大厅</a>
                <button id="hlgx-btn-restart" class="primary-btn">再来一局</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('hlgx_hua.static', filename='js/hlgx_substances.js') }}"></script>
    <script src="{{ url_for('hlgx_hua.static', filename='js/hlgx_hua.js') }}"></script>
</body>
</html>

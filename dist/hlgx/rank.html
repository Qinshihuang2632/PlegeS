<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化了个学 · 排行榜</title>
    <link rel="stylesheet" href="/css/hlgx_style.css">
</head>
<body class="hub-page">
    <header class="hlgx-header">
        <a class="back" href="/">← 返回大厅</a>
        <h1>🏆 排行榜</h1>
        <p class="subtitle">排序:剩余血量多 → 用时短 → 技能使用次数少(失败记录也会上榜)</p>
    </header>

    <div class="rank-tabs">
        <button data-mode="easy">简单</button>
        <button data-mode="normal" class="active">标准</button>
        <button data-mode="challenge">挑战</button>
        <button id="rank-clear" class="rank-clear">清空当前榜单</button>
    </div>

    <div class="rank-table-wrap">
        <table class="rank-table">
            <thead>
                <tr><th>#</th><th>昵称</th><th>血量</th><th>用时</th><th>技能</th><th>上榜时间</th></tr>
            </thead>
            <tbody id="rank-body"></tbody>
        </table>
        <p id="rank-empty" class="rank-empty">暂无记录</p>
    </div>

    <!-- 管理员密码弹窗(清空榜单需密码) -->
    <div id="hlgx-pw-modal" class="modal hidden">
        <div class="modal-box">
            <h2>🔒 管理员验证</h2>
            <p id="hlgx-pw-tip" class="pw-tip"></p>
            <input type="password" id="hlgx-pw-input" maxlength="64" placeholder="输入管理员密码" autocomplete="off">
            <div class="btn-row">
                <button id="hlgx-pw-cancel" class="back-btn">取消</button>
                <button id="hlgx-pw-confirm" class="primary-btn">确认清空</button>
            </div>
        </div>
    </div>

    <script>
    const MODE_LABEL = { easy: "简单", normal: "标准", challenge: "挑战" };
    let curMode = "normal";
    const pwModal = document.getElementById("hlgx-pw-modal");
    const pwInput = document.getElementById("hlgx-pw-input");
    const pwTip = document.getElementById("hlgx-pw-tip");
    const pwConfirm = document.getElementById("hlgx-pw-confirm");
    const pwCancel = document.getElementById("hlgx-pw-cancel");
    function openPwModal() {
        pwInput.value = "";
        pwTip.textContent = "";
        pwModal.classList.remove("hidden");
        pwInput.focus();
    }
    function closePwModal() { pwModal.classList.add("hidden"); }
    function fmt(s) {
        const m = Math.floor(s / 60), ss = s % 60;
        return (m < 10 ? "0" + m : m) + ":" + (ss < 10 ? "0" + ss : ss);
    }
    async function load() {
        const res = await fetch("/hlgx/api/rank?mode=" + curMode);
        const data = await res.json();
        const body = document.getElementById("rank-body");
        body.innerHTML = "";
        document.getElementById("rank-empty").style.display = data.rank.length ? "none" : "block";
        data.rank.forEach((e, i) => {
            const tr = document.createElement("tr");
            const rank = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
            tr.innerHTML = "<td>" + rank + "</td><td>" + e.name + "</td><td>❤" + e.hp
                + "</td><td>" + fmt(e.time) + "</td><td>" + e.tools + "</td><td>" + e.date + "</td>";
            body.appendChild(tr);
        });
    }
    document.querySelectorAll(".rank-tabs button[data-mode]").forEach(b => {
        b.addEventListener("click", () => {
            document.querySelectorAll(".rank-tabs button[data-mode]").forEach(x => x.classList.remove("active"));
            b.classList.add("active");
            curMode = b.dataset.mode;
            load();
        });
    });
    document.getElementById("rank-clear").addEventListener("click", openPwModal);
    pwConfirm.addEventListener("click", async () => {
        const pw = pwInput.value;
        if (!pw) { pwTip.textContent = "请输入密码"; return; }
        pwConfirm.disabled = true;
        try {
            const res = await fetch("/hlgx/api/rank?mode=" + curMode, {
                method: "DELETE",
                headers: { "X-Admin-Password": pw },
            });
            const data = await res.json();
            if (!res.ok || !data.ok) { pwTip.textContent = data.msg || "操作失败"; return; }
            closePwModal();
            load();
        } finally {
            pwConfirm.disabled = false;
        }
    });
    pwCancel.addEventListener("click", closePwModal);
    pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") pwConfirm.click(); });
    load();
    </script>
</body>
</html>
